Identifier: eos2srx
Slug: synomega
Status: In progress
Title: Route-Based Synthesizability Score
Description: Scores how readily a compound can be made by running a 
  retrosynthetic search against a catalogue of purchasable building blocks, so 
  the result reflects commercial availability rather than structure alone. A 
  directed message-passing network trained on a large atom-mapped reaction 
  corpus proposes disconnections, restricted to templates that split the target 
  into smaller precursors, and an AND-OR search assembles routes to purchasable 
  material. Returns a continuous score with the step and precursor counts of the
  best route. Protecting-group steps are excluded by design.
